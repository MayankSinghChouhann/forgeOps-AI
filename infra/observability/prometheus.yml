global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: forgeops-backend
    metrics_path: /actuator/prometheus
    basic_auth:
      username: forgeops-monitor
      password_file: /run/secrets/metrics_password
    static_configs:
      - targets: ["backend:8080"]
        labels:
          environment: local
