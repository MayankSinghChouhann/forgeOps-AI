services:
  # ----------------------------------------------------
  # 1. PostgreSQL Database
  # ----------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: forgeops-postgres
    environment:
      POSTGRES_USER: forgeops_user
      POSTGRES_PASSWORD: forgeops_password
      POSTGRES_DB: forgeops_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forgeops_user -d forgeops_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - forgeops-network

  # ----------------------------------------------------
  # 2. Redis Cache
  # ----------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: forgeops-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - forgeops-network

  # ----------------------------------------------------
  # 3. Spring Boot Backend
  # ----------------------------------------------------
  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: forgeops-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/forgeops_db
      SPRING_DATASOURCE_USERNAME: forgeops_user
      SPRING_DATASOURCE_PASSWORD: forgeops_password
      FORGEOPS_JWT_SECRET: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - forgeops-network

  # ----------------------------------------------------
  # 4. React Frontend (Nginx)
  # ----------------------------------------------------
  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    container_name: forgeops-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80/"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - forgeops-network

volumes:
  postgres_data:
  redis_data:

networks:
  forgeops-network:
    driver: bridge
