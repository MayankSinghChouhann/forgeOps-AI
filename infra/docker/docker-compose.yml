services:
  # ----------------------------------------------------
  # 1. PostgreSQL Database
  # ----------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: forgeops-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-forgeops_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in infra/docker/.env}
      POSTGRES_DB: ${POSTGRES_DB:-forgeops_db}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-forgeops_user} -d ${POSTGRES_DB:-forgeops_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - forgeops-network

  # ----------------------------------------------------
  # 2. Redis Cache
  # ----------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: forgeops-redis
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in infra/docker/.env}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in infra/docker/.env}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in infra/docker/.env}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - forgeops-network

  # ----------------------------------------------------
  # 3. Spring Boot Backend
  # ----------------------------------------------------
  backend:
    image: "${BACKEND_IMAGE:-forgeops-ai-backend:local}"
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: forgeops-backend
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/forgeops_db
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-forgeops_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in infra/docker/.env}
      FORGEOPS_JWT_SECRET: ${FORGEOPS_JWT_SECRET:?Set a Base64-encoded 256-bit JWT secret}
      FORGEOPS_ALLOWED_ORIGINS: ${FORGEOPS_ALLOWED_ORIGINS:?Set FORGEOPS_ALLOWED_ORIGINS to the trusted frontend origin}
      FORGEOPS_REFRESH_COOKIE_SECURE: ${FORGEOPS_REFRESH_COOKIE_SECURE:?Set true for HTTPS deployments or false for local HTTP only}
      FORGEOPS_BOOTSTRAP_ENABLED: ${FORGEOPS_BOOTSTRAP_ENABLED:-false}
      FORGEOPS_BOOTSTRAP_ADMIN_EMAIL: ${FORGEOPS_BOOTSTRAP_ADMIN_EMAIL:-}
      FORGEOPS_BOOTSTRAP_ADMIN_PASSWORD: ${FORGEOPS_BOOTSTRAP_ADMIN_PASSWORD:-}
      FORGEOPS_REDIS_CACHE_ENABLED: "true"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in infra/docker/.env}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      FORGEOPS_METRICS_USERNAME: forgeops-monitor
      FORGEOPS_METRICS_PASSWORD: ${FORGEOPS_METRICS_PASSWORD:?Set FORGEOPS_METRICS_PASSWORD in infra/docker/.env}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - forgeops-network

  # ----------------------------------------------------
  # 4. React Frontend (Nginx)
  # ----------------------------------------------------
  frontend:
    image: "${FRONTEND_IMAGE:-forgeops-ai-frontend:local}"
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    container_name: forgeops-frontend
    ports:
      - "${FRONTEND_BIND_ADDRESS:-127.0.0.1}:3000:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - forgeops-network

  prometheus:
    image: prom/prometheus:v3.13.3
    container_name: forgeops-prometheus
    profiles: ["observability"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - ../observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    secrets:
      - metrics_password
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - forgeops-network

  grafana:
    image: grafana/grafana:13.1.6
    container_name: forgeops-grafana
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in infra/docker/.env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - forgeops-network

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:

secrets:
  metrics_password:
    environment: FORGEOPS_METRICS_PASSWORD

networks:
  forgeops-network:
    driver: bridge
