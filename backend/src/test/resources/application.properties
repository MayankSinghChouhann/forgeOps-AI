# Hermetic In-Memory Test Configuration (H2)
# Ensures unit & integration tests run independently of external databases/Docker

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

spring.flyway.enabled=false

management.endpoints.web.exposure.include=health,info

forgeops.app.jwtSecret=dGVzdC1vbmx5LWZvcmdlb3BzLWp3dC1zZWNyZXQtbm90LWZvci1wcm9kdWN0aW9u
forgeops.app.jwtExpirationMs=3600000
forgeops.app.jwtRefreshExpirationMs=86400000
forgeops.ai.gemini.api-key=
forgeops.security.allowed-origins=http://localhost:5173
forgeops.security.rate-limit.auth-per-minute=20
forgeops.security.rate-limit.ai-per-minute=60
