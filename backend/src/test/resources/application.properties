# Hermetic In-Memory Test Configuration (H2)
# Ensures unit & integration tests run independently of external databases/Docker

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

spring.flyway.enabled=false

management.endpoints.web.exposure.include=health,info

forgeops.app.jwtSecret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
forgeops.app.jwtExpirationMs=3600000
forgeops.app.jwtRefreshExpirationMs=86400000
