spring.application.name=backend

# Database Configuration (12-Factor App Environment Variables)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Actuator Endpoints & Health Check
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}
forgeops.metrics.username=${FORGEOPS_METRICS_USERNAME:forgeops-monitor}
forgeops.metrics.password=${FORGEOPS_METRICS_PASSWORD:}

# OpenAPI documentation
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.api-docs.path=/v3/api-docs

# JWT Configuration
forgeops.app.jwtSecret=${FORGEOPS_JWT_SECRET}
forgeops.app.jwtExpirationMs=${FORGEOPS_JWT_EXPIRATION_MS:3600000}
forgeops.app.jwtRefreshExpirationMs=${FORGEOPS_JWT_REFRESH_EXPIRATION_MS:86400000}
forgeops.auth.refresh-cookie-secure=${FORGEOPS_REFRESH_COOKIE_SECURE:false}

# Security and bootstrap settings are environment-driven.
forgeops.security.allowed-origins=${FORGEOPS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
forgeops.security.rate-limit.auth-per-minute=${FORGEOPS_AUTH_RATE_LIMIT:20}
forgeops.security.rate-limit.ai-per-minute=${FORGEOPS_AI_RATE_LIMIT:60}
forgeops.bootstrap.enabled=${FORGEOPS_BOOTSTRAP_ENABLED:false}
forgeops.bootstrap.admin-email=${FORGEOPS_BOOTSTRAP_ADMIN_EMAIL:}
forgeops.bootstrap.admin-password=${FORGEOPS_BOOTSTRAP_ADMIN_PASSWORD:}
forgeops.cache.redis.enabled=${FORGEOPS_REDIS_CACHE_ENABLED:false}
forgeops.cache.redis.dashboard-ttl=${FORGEOPS_DASHBOARD_CACHE_TTL:5s}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.connect-timeout=2s
spring.data.redis.timeout=2s
spring.data.redis.repositories.enabled=false

# =============================================================
# Google Gemini AI Configuration
# API Key is injected from environment — never hardcoded here.
# Fallback to empty string means the local rule engine is used.
# =============================================================
forgeops.ai.gemini.api-key=${GEMINI_API_KEY:}
forgeops.ai.gemini.model=${GEMINI_MODEL:gemini-3.8-flash}
forgeops.ai.gemini.base-url=https://generativelanguage.googleapis.com/v1beta/models
forgeops.ai.gemini.max-attempts=${GEMINI_MAX_ATTEMPTS:3}
forgeops.ai.gemini.initial-backoff-ms=${GEMINI_INITIAL_BACKOFF_MS:250}
