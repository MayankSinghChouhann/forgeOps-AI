spring.application.name=backend

# Database Configuration (12-Factor App Environment Variables)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/forgeops_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:forgeops_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:forgeops_password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Actuator Endpoints & Health Check
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always

# JWT Configuration
forgeops.app.jwtSecret=${FORGEOPS_JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
forgeops.app.jwtExpirationMs=${FORGEOPS_JWT_EXPIRATION_MS:3600000}
forgeops.app.jwtRefreshExpirationMs=${FORGEOPS_JWT_REFRESH_EXPIRATION_MS:86400000}

# =============================================================
# Google Gemini AI Configuration
# API Key is injected from environment — never hardcoded here.
# Fallback to empty string means the local rule engine is used.
# =============================================================
forgeops.ai.gemini.api-key=${GEMINI_API_KEY:}
forgeops.ai.gemini.model=${GEMINI_MODEL:gemini-1.5-flash}
forgeops.ai.gemini.base-url=https://generativelanguage.googleapis.com/v1beta/models
