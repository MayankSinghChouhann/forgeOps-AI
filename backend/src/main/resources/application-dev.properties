# Local development profile. Never use these defaults in a shared environment.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/forgeops_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:forgeops_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:forgeops_password}

# Development-only signing key. Production has no fallback.
forgeops.app.jwtSecret=${FORGEOPS_JWT_SECRET:ZGV2LW9ubHktZm9yZ2VvcHMtc2lnbmluZy1rZXktMzItYnl0ZXM=}
management.endpoint.health.show-details=always
